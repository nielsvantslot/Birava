# Dependabot version updates. Security updates are a separate repository
# setting (Settings > Code security) and open PRs independent of this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # PRs target dev, not the stale default branch (see CLAUDE.md branch workflow).
    target-branch: dev
    groups:
      # One PR per week for routine bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deliberate, separately planned upgrades (v2 plan, "later" phase):
      # Prisma 7 is a real migration (ESM-only, driver adapter), and Next.js 16
      # is blocked on an upstream /_global-error prerender bug. See CLAUDE.md.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    groups:
      actions:
        patterns: ["*"]
