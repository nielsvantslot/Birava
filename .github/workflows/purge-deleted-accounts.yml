name: Purge deleted accounts

# Consolidated onto the same scheduling mechanism as session-reminders.yml /
# cleanup-orphaned-blobs.yml rather than vercel.json's native cron — every
# scheduled job lives on one platform.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The app lives at app.birava.nl (birava.nl is the marketing site and redirects API paths away).
      # A non-200, including a redirect, fails the step: curl -f alone would call a 3xx a success.
      - name: Trigger purge-deleted-accounts cron (production)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.birava.nl/api/cron/purge-deleted-accounts")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Trigger purge-deleted-accounts cron (staging)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://staging.app.birava.nl/api/cron/purge-deleted-accounts")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]
