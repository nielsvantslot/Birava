name: Prune client error logs

# Keeps the ClientErrorLog table (modules/diagnostics/application/clientErrorLogCommands.ts)
# bounded on Neon's free-tier storage — same GitHub Actions scheduling
# pattern as session-reminders.yml/cleanup-orphaned-blobs.yml rather than
# vercel.json's native cron, so every scheduled job lives on one platform.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The app lives at app.birava.nl (birava.nl is the marketing site and redirects API paths away).
      # A non-200, including a redirect, fails the step: curl -f alone would call a 3xx a success.
      - name: Trigger prune-client-error-logs cron (production)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.birava.nl/api/cron/prune-client-error-logs")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Trigger prune-client-error-logs cron (staging)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://staging.app.birava.nl/api/cron/prune-client-error-logs")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]
