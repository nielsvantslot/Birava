name: Session reminders

# Vercel Hobby plan only allows a cron to run once a day, so vercel.json
# can't run this on the every-15-min cadence the feature actually needs
# (see the "Switch session-reminder cron to a daily schedule" commit) —
# a once-daily fixed-time check almost never overlaps a session's 1-4h
# quiet window. GitHub Actions has no such restriction, so this pings the
# same CRON_SECRET-guarded endpoint on the originally intended cadence.
# app/api/cron/session-reminders/route.ts dedupes against already-sent
# Notification rows, so overlapping/duplicate runs are harmless.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The app lives at app.birava.nl (birava.nl is the marketing site and redirects API paths away).
      # A non-200, including a redirect, fails the step: curl -f alone would call a 3xx a success.
      - name: Trigger session-reminders cron (production)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.birava.nl/api/cron/session-reminders")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Trigger session-reminders cron (staging)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://staging.app.birava.nl/api/cron/session-reminders")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]
