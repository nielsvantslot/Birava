name: Health check

# An uptime check with no extra service: every 30 minutes this calls /api/health,
# which answers non-200 when the database is unreachable, the newest backup is
# older than 36 hours, or any scheduled job has not succeeded within three of
# its own intervals (session reminders: 45 minutes; the daily jobs: 3 days).
# A failed run makes GitHub email the repository's watchers, which is the alert.
# If a dedicated uptime monitor is added later (UptimeRobot, Better Stack, a free
# tier), point it at the same URL and alert on a non-200; this workflow can then go.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The app lives at app.birava.nl (birava.nl is the marketing site, which redirects API
      # paths away). Only a 200 passes: a redirect or an error page fails the step.
      # The secret unlocks the detailed report (the public answer is only { ok }), so a failed run shows why.
      - name: Production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 -H "Authorization: Bearer ${CRON_SECRET}" "https://app.birava.nl/api/health")
          cat /tmp/health.json; echo
          [ "${code}" = "200" ]

      - name: Staging
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 -H "Authorization: Bearer ${CRON_SECRET}" "https://staging.app.birava.nl/api/health")
          cat /tmp/health.json; echo
          [ "${code}" = "200" ]
