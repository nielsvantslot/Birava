name: CI

on:
  pull_request:
  # Also gate direct pushes to the long-lived branches, so a push that skips
  # a pull request can't bypass lint/typecheck/tests.
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: birava
          POSTGRES_USER: birava
          POSTGRES_PASSWORD: birava
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U birava -d birava"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://birava:birava@localhost:5432/birava?schema=public
      PORT: "3001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cheapest checks first — no DB needed, fail fast before anything else.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Module boundaries
        run: npm run depcruise

      # The OpenAPI document is generated from the route definitions; the committed copy must match.
      - name: OpenAPI document is current
        run: npx tsx scripts/generate-openapi.ts --check

      - name: Unit tests
        run: npm run test:unit

      - name: Run migrations against a fresh database
        run: npm run db:migrate

      # The service Postgres above is already a fresh, isolated container
      # for this run — no separate test database needed in CI.
      # Runs unit + integration together so coverage covers both, and fails
      # if a floor in vitest.config.ts is breached.
      - name: Integration tests and coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      # Per-route gzipped JS against perf-budgets.json; fails if a page got heavier than agreed.
      - name: JavaScript budgets
        run: npm run budgets:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: npm run test:e2e
