name: Cleanup orphaned blobs

# Consolidated onto the same scheduling mechanism as session-reminders.yml
# rather than vercel.json's native cron. This job only needs a once-daily
# cadence, which Vercel Hobby's cron limit would have covered on its own —
# but running every scheduled job through GitHub Actions means there's one
# place to check when a cron didn't fire, not a split between the Vercel
# dashboard's Cron tab and this one.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The app lives at app.birava.nl (birava.nl is the marketing site and redirects API paths away).
      # A non-200, including a redirect, fails the step: curl -f alone would call a 3xx a success.
      - name: Trigger cleanup-orphaned-blobs cron (production)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://app.birava.nl/api/cron/cleanup-orphaned-blobs")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Trigger cleanup-orphaned-blobs cron (staging)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://staging.app.birava.nl/api/cron/cleanup-orphaned-blobs")
          echo "HTTP ${code}"
          [ "${code}" = "200" ]
